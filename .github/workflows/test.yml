name: Test
on:
  pull_request:
    paths:
      - "action.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Test with Explicit Generator Version
        uses: ./
        with:
          language: python
          api-spec-path: ./utils/bandwidth.yml
          config: ./utils/test-config.yml
          openapi-generator-version: 7.6.0

      - name: Run Test with Generator Version from openapitools.json
        uses: ./
        with:
          language: python
          api-spec-path: ./utils/bandwidth.yml
          config: ./utils/test-config.yml
